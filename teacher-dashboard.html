<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* Animated Background Particles */
  .particle {
    position: fixed;
    width: 10px;
    height: 10px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    pointer-events: none;
    animation: float 15s infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    padding: 25px 40px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    margin-bottom: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    animation: slideDown 0.6s ease-out;
  }

  @keyframes slideDown {
    from {
      opacity: 0;
      transform: translateY(-50px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .header h1 {
    color: #667eea;
    font-size: 2rem;
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .header h1 i {
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .logout-btn {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    border: none;
    color: white;
    padding: 12px 30px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
  }

  .logout-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(245, 87, 108, 0.6);
  }

  /* Grid Layout */
  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
    gap: 30px;
    margin-bottom: 30px;
  }

  /* Cards */
  .card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    animation: fadeInUp 0.6s ease-out;
    transition: all 0.3s ease;
  }

  .card:hover {
    transform: translateY(-10px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(50px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .card:nth-child(1) { animation-delay: 0.1s; }
  .card:nth-child(2) { animation-delay: 0.2s; }
  .card:nth-child(3) { animation-delay: 0.3s; }

  .card-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 3px solid #667eea;
  }

  .card-header i {
    font-size: 2rem;
    color: #667eea;
  }

  .card-header h3 {
    color: #333;
    font-size: 1.5rem;
    font-weight: 600;
  }

  /* Form Styles */
  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    color: #555;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 0.95rem;
  }

  .form-group input,
  .form-group select {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 1rem;
    transition: all 0.3s ease;
    background: white;
  }

  .form-group input:focus,
  .form-group select:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    transform: translateY(-2px);
  }

  .submit-btn {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    color: white;
    padding: 14px 40px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 1.05rem;
    font-weight: 600;
    width: 100%;
    transition: all 0.3s ease;
    box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
  }

  .submit-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(102, 126, 234, 0.6);
  }

  /* List Styles */
  .list-container {
    max-height: 500px;
    overflow-y: auto;
    padding-right: 10px;
  }

  .list-container::-webkit-scrollbar {
    width: 6px;
  }

  .list-container::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 10px;
  }

  .list-container::-webkit-scrollbar-thumb {
    background: #667eea;
    border-radius: 10px;
  }

  .list-item {
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 15px;
    transition: all 0.3s ease;
    animation: slideIn 0.5s ease-out;
    border-left: 4px solid #667eea;
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateX(-30px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  .list-item:hover {
    transform: translateX(10px);
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
  }

  .list-item strong {
    color: #667eea;
    font-size: 1.1rem;
  }

  .list-item-meta {
    color: #666;
    font-size: 0.9rem;
    margin: 8px 0;
  }

  .list-item-actions {
    margin-top: 15px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .action-btn {
    padding: 8px 20px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .approve-btn {
    background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
    color: white;
    box-shadow: 0 3px 10px rgba(56, 239, 125, 0.3);
  }

  .approve-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(56, 239, 125, 0.5);
  }

  .cancel-btn {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    color: white;
    box-shadow: 0 3px 10px rgba(245, 87, 108, 0.3);
  }

  .cancel-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(245, 87, 108, 0.5);
  }

  .reply-btn {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    box-shadow: 0 3px 10px rgba(102, 126, 234, 0.3);
  }

  .reply-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.5);
  }

  .reply-form {
    margin-top: 15px;
    padding: 15px;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 10px;
    display: none;
  }

  .reply-form.active {
    display: block;
    animation: slideIn 0.3s ease-out;
  }

  .reply-form textarea {
    width: 100%;
    padding: 10px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 0.95rem;
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
  }

  .reply-form textarea:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  }

  .reply-form-actions {
    margin-top: 10px;
    display: flex;
    gap: 10px;
  }

  .status-badge {
    display: inline-block;
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
  }

  .status-pending {
    background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
    color: #d63031;
  }

  .status-approved {
    background: linear-gradient(135deg, #55efc4 0%, #00b894 100%);
    color: #00362c;
  }

  .status-cancelled {
    background: linear-gradient(135deg, #fab1a0 0%, #e17055 100%);
    color: #6c0000;
  }

  .empty-state {
    text-align: center;
    padding: 40px;
    color: #999;
  }

  .empty-state i {
    font-size: 3rem;
    margin-bottom: 15px;
    opacity: 0.5;
  }

  /* Stats Cards */
  .stats-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }

  .stat-card {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.85) 100%);
    backdrop-filter: blur(10px);
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    transition: all 0.3s ease;
    animation: fadeInUp 0.6s ease-out;
  }

  .stat-card:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  }

  .stat-card i {
    font-size: 2.5rem;
    margin-bottom: 10px;
  }

  .stat-card.messages i { color: #667eea; }
  .stat-card.appointments i { color: #f5576c; }
  .stat-card.pending i { color: #fdcb6e; }
  .stat-card.approved i { color: #00b894; }

  .stat-card h4 {
    font-size: 2rem;
    color: #333;
    margin: 10px 0 5px 0;
  }

  .stat-card p {
    color: #666;
    font-size: 0.9rem;
  }

  @media (max-width: 768px) {
    .dashboard-grid {
      grid-template-columns: 1fr;
    }
    
    .header {
      flex-direction: column;
      gap: 20px;
      text-align: center;
    }
  }
</style>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
  import {
    getFirestore,
    collection,
    query,
    where,
    onSnapshot,
    orderBy,
    addDoc,
    updateDoc,
    doc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";
  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDBq46naDEGOMX_8psHUCyE14eZKFiOi5k",
    authDomain: "student-3ff50.firebaseapp.com",
    projectId: "student-3ff50",
    storageBucket: "student-3ff50.firebasestorage.app",
    messagingSenderId: "117896468121",
    appId: "1:117896468121:web:25885acc15551edfe54a08"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let teacherEmail = "";
  let stats = {
    messages: 0,
    appointments: 0,
    pending: 0,
    approved: 0
  };

  // Create animated particles
  function createParticles() {
    const body = document.body;
    for (let i = 0; i < 20; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 15 + 's';
      particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
      body.appendChild(particle);
    }
  }

  createParticles();

  onAuthStateChanged(auth, (user) => {
    if (user) {
      teacherEmail = user.email;
      loadMessages();
      loadAppointments();
      // Form is now always visible, no need to toggle display
    } else {
      window.location.href = "index.html";
    }
  });

  function updateStats() {
    document.getElementById('statMessages').textContent = stats.messages;
    document.getElementById('statAppointments').textContent = stats.appointments;
    document.getElementById('statPending').textContent = stats.pending;
    document.getElementById('statApproved').textContent = stats.approved;
  }

  function loadMessages() {
    const messagesRef = collection(db, "messages");
    const q = query(messagesRef, where("to", "==", teacherEmail), orderBy("timestamp", "desc"));

    onSnapshot(q, (snapshot) => {
      const messagesList = document.getElementById("messagesList");
      messagesList.innerHTML = "";
      stats.messages = snapshot.size;
      
      if (snapshot.empty) {
        messagesList.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No messages yet</p></div>';
      } else {
        snapshot.forEach((doc) => {
          const msg = doc.data();
          const msgId = doc.id;
          const timeStr = msg.timestamp ? new Date(msg.timestamp.seconds * 1000).toLocaleString() : "Unknown time";
          const div = document.createElement("div");
          div.className = "list-item";
          div.innerHTML = `
            <div><strong><i class="fas fa-user"></i> ${msg.from}</strong></div>
            <div class="list-item-meta"><i class="far fa-clock"></i> ${timeStr}</div>
            <div style="margin-top: 10px; color: #333;">${msg.message}</div>
            <div class="list-item-actions">
              <button class="action-btn reply-btn" onclick="toggleReplyForm('${msgId}')">
                <i class="fas fa-reply"></i> Reply
              </button>
            </div>
            <div class="reply-form" id="reply-form-${msgId}">
              <textarea id="reply-text-${msgId}" placeholder="Type your reply..."></textarea>
              <div class="reply-form-actions">
                <button class="action-btn reply-btn" onclick="sendReply('${msgId}', '${msg.from}')">
                  <i class="fas fa-paper-plane"></i> Send
                </button>
                <button class="action-btn cancel-btn" onclick="toggleReplyForm('${msgId}')">
                  <i class="fas fa-times"></i> Cancel
                </button>
              </div>
            </div>
          `;
          messagesList.appendChild(div);
        });
      }
      updateStats();
    }, (error) => {
      console.error("Failed to load messages:", error);
    });
  }

  function loadAppointments() {
    const appointmentsRef = collection(db, "appointments");
    const q = query(appointmentsRef, where("teacher", "==", teacherEmail), orderBy("time", "desc"));

    onSnapshot(q, (snapshot) => {
      const apptsList = document.getElementById("appointmentsList");
      apptsList.innerHTML = "";
      stats.appointments = snapshot.size;
      stats.pending = 0;
      stats.approved = 0;
      
      if (snapshot.empty) {
        apptsList.innerHTML = '<div class="empty-state"><i class="far fa-calendar-times"></i><p>No appointments scheduled</p></div>';
      } else {
        snapshot.forEach((doc) => {
          const appt = doc.data();
          const id = doc.id;
          const timeStr = appt.time ? new Date(appt.time).toLocaleString() : "Unknown time";
          
          if (appt.status === 'pending') stats.pending++;
          if (appt.status === 'approved') stats.approved++;
          
          const statusClass = `status-${appt.status}`;
          const div = document.createElement("div");
          div.className = "list-item";
          div.innerHTML = `
            <div><strong><i class="fas fa-calendar-check"></i> ${appt.title}</strong></div>
            <div class="list-item-meta">
              <i class="fas fa-user-graduate"></i> ${appt.student} | 
              <i class="fas fa-building"></i> ${appt.department} | 
              <i class="fas fa-book"></i> ${appt.subject}
            </div>
            <div class="list-item-meta"><i class="far fa-clock"></i> ${timeStr}</div>
            <div style="margin-top: 10px;">
              Status: <span class="status-badge ${statusClass}" id="status-${id}">${appt.status}</span>
            </div>
            <div class="list-item-actions">
              <button class="action-btn approve-btn" onclick="changeAppointmentStatus('${id}', 'approved')">
                <i class="fas fa-check"></i> Approve
              </button>
              <button class="action-btn cancel-btn" onclick="changeAppointmentStatus('${id}', 'cancelled')">
                <i class="fas fa-times"></i> Cancel
              </button>
            </div>
          `;
          apptsList.appendChild(div);
        });
      }
      updateStats();
    }, (error) => {
      console.error("Failed to load appointments:", error);
    });
  }

  window.changeAppointmentStatus = async (id, status) => {
    try {
      const apptRef = doc(db, "appointments", id);
      await updateDoc(apptRef, { status });
      
      const badge = document.getElementById(`status-${id}`);
      badge.textContent = status;
      badge.className = `status-badge status-${status}`;
      
      // Show success notification
      showNotification(`Appointment ${status}!`, 'success');
    } catch (error) {
      showNotification('Failed to update appointment status.', 'error');
      console.error(error);
    }
  };

  window.scheduleAppointment = async (e) => {
    e.preventDefault();
    const title = document.getElementById("title").value.trim();
    const student = document.getElementById("studentEmail").value.trim();
    const department = document.getElementById("department").value.trim();
    const subject = document.getElementById("subject").value.trim();
    const timeStr = document.getElementById("time").value;

    if (!title || !student || !department || !subject || !timeStr) {
      showNotification('Please fill all fields.', 'error');
      return;
    }

    const time = new Date(timeStr).getTime();

    try {
      await addDoc(collection(db, "appointments"), {
        title,
        teacher: teacherEmail,
        student,
        department,
        subject,
        time,
        status: "pending",
        createdAt: serverTimestamp()
      });
      showNotification('Appointment scheduled successfully!', 'success');
      e.target.reset();
    } catch (error) {
      showNotification('Failed to schedule appointment.', 'error');
      console.error(error);
    }
  };

  window.logout = async () => {
    try {
      await signOut(auth);
      window.location.href = "index.html";
    } catch (error) {
      showNotification('Logout failed', 'error');
    }
  };

  window.toggleReplyForm = (msgId) => {
    const form = document.getElementById(`reply-form-${msgId}`);
    form.classList.toggle('active');
  };

  window.sendReply = async (msgId, studentEmail) => {
    const replyText = document.getElementById(`reply-text-${msgId}`).value.trim();
    
    if (!replyText) {
      showNotification('Please enter a reply message.', 'error');
      return;
    }

    try {
      await addDoc(collection(db, "messages"), {
        from: teacherEmail,
        to: studentEmail,
        message: replyText,
        timestamp: serverTimestamp()
      });
      
      showNotification('Reply sent successfully!', 'success');
      document.getElementById(`reply-text-${msgId}`).value = '';
      toggleReplyForm(msgId);
    } catch (error) {
      showNotification('Failed to send reply.', 'error');
      console.error(error);
    }
  };

  function showNotification(message, type) {
    const notification = document.createElement('div');
    notification.style.cssText = `
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 25px;
      background: ${type === 'success' ? 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)' : 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)'};
      color: white;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      z-index: 9999;
      animation: slideInRight 0.5s ease-out;
      font-weight: 600;
    `;
    notification.textContent = message;
    document.body.appendChild(notification);

    setTimeout(() => {
      notification.style.animation = 'slideOutRight 0.5s ease-out';
      setTimeout(() => notification.remove(), 500);
    }, 3000);
  }

  const style = document.createElement('style');
  style.textContent = `
    @keyframes slideInRight {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideOutRight {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(400px); opacity: 0; }
    }
  `;
  document.head.appendChild(style);
</script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        <i class="fas fa-chalkboard-teacher"></i>
        Teacher Dashboard
      </h1>
      <button class="logout-btn" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>

    <div class="stats-container">
      <div class="stat-card messages">
        <i class="fas fa-envelope"></i>
        <h4 id="statMessages">0</h4>
        <p>Messages</p>
      </div>
      <div class="stat-card appointments">
        <i class="fas fa-calendar-alt"></i>
        <h4 id="statAppointments">0</h4>
        <p>Total Appointments</p>
      </div>
      <div class="stat-card pending">
        <i class="fas fa-clock"></i>
        <h4 id="statPending">0</h4>
        <p>Pending</p>
      </div>
      <div class="stat-card approved">
        <i class="fas fa-check-circle"></i>
        <h4 id="statApproved">0</h4>
        <p>Approved</p>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="card">
        <div class="card-header">
          <i class="fas fa-calendar-plus"></i>
          <h3>Schedule Appointment</h3>
        </div>
        <form id="scheduleForm" onsubmit="scheduleAppointment(event)">
          <div class="form-group">
            <label for="title"><i class="fas fa-heading"></i> Appointment Title</label>
            <input type="text" id="title" placeholder="Enter appointment title" required />
          </div>

          <div class="form-group">
            <label for="studentEmail"><i class="fas fa-user-graduate"></i> Student Email</label>
            <input type="email" id="studentEmail" placeholder="Enter student email" required />
          </div>

          <div class="form-group">
            <label for="department"><i class="fas fa-building"></i> Department</label>
            <input type="text" id="department" placeholder="Enter department" required />
          </div>

          <div class="form-group">
            <label for="subject"><i class="fas fa-book"></i> Subject</label>
            <input type="text" id="subject" placeholder="Enter subject" required />
          </div>

          <div class="form-group">
            <label for="time"><i class="far fa-calendar"></i> Appointment Date & Time</label>
            <input type="datetime-local" id="time" required />
          </div>

          <button type="submit" class="submit-btn">
            <i class="fas fa-paper-plane"></i> Schedule Appointment
          </button>
        </form>
      </div>

      <div class="card">
        <div class="card-header">
          <i class="fas fa-envelope-open-text"></i>
          <h3>Messages</h3>
        </div>
        <div class="list-container" id="messagesList">
          <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading messages...</p></div>
        </div>
      </div>

      <div class="card" style="grid-column: 1 / -1;">
        <div class="card-header">
          <i class="fas fa-calendar-check"></i>
          <h3>Appointments</h3>
        </div>
        <div class="list-container" id="appointmentsList">
          <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading appointments...</p></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
